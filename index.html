<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Estate Platform</title>
    <link rel="stylesheet" href="src/css/style.css" />

    <!-- Google Font: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container">
        <div class="logo">
          <a href="index.html">
            <img src="src/images/logo.png" alt="logo" />
          </a>
        </div>
        <nav class="nav">
          <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="#">Discover</a></li>
            <li><a href="#">Contact us</a></li>
            <li><a href="#">Sign in</a></li>
          </ul>
        </nav>
        <!-- BOTTOM NAVBAR -->
        <nav class="bottom-nav">
          <a href="#" class="nav-item active">
            <img src="src/images/home.png" alt="Home" />
            <span>Home</span>
          </a>
          <a href="#" class="nav-item">
            <img src="src/images/discover.png" alt="Discover" />
            <span>Discover</span>
          </a>
          <div>
            <a href="#" class="nav-item sell-btn">
              <img src="src/images/sell.png" alt="Sell" />
            </a>
            <span class="bottom-nav-sell">Sell</span>
          </div>

          <a href="#" class="nav-item">
            <img src="src/images/message.png" alt="Message" />
            <span>Message</span>
          </a>
          <a href="#" class="nav-item">
            <img src="src/images/profile.png" alt="Profile" />
            <span>Profile</span>
          </a>
        </nav>

        <button class="btn-sell">Sell something</button>
        <div class="search-btn">
          <button>
            <svg
              position="absolute"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g opacity="0.5" clip-path="url(#clip0_0_296)">
                <path
                  d="M8.15625 14.0625C11.4182 14.0625 14.0625 11.4182 14.0625 8.15625C14.0625 4.89432 11.4182 2.25 8.15625 2.25C4.89432 2.25 2.25 4.89432 2.25 8.15625C2.25 11.4182 4.89432 14.0625 8.15625 14.0625Z"
                  stroke="black"
                  stroke-width="1.125"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M12.3327 12.3328L15.7499 15.75"
                  stroke="black"
                  stroke-width="1.125"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
              <defs>
                <clipPath id="clip0_0_296">
                  <rect width="18" height="18" fill="white" />
                </clipPath>
              </defs>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN SECTION -->
    <main class="main">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="filter-box">
          <h3>Location</h3>
          <select>
            <option>All Kenya</option>
            <option>Nairobi</option>
            <option>Mombasa</option>
          </select>
        </div>

        <div class="filter-box">
          <h3>Property</h3>
          <ul>
            <li>
              <label>
                <input type="checkbox" checked />
                Houses & Apartments for Rent
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" checked />
                Houses & Apartments for Sale
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" />
                Land & Plots for Rent
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" />
                Land & Plots for Sale
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" />
                Commercial Property for Rent
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" />
                Commercial Property for Sale
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" />
                Short Let Property
              </label>
            </li>
          </ul>
        </div>

        <div class="filter-box">
          <h3>Price range</h3>
          <ul>
            <li>
              <label>
                <input type="checkbox" checked />
                Under 13K
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" checked />
                13K – 160K
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" checked />
                160K – 6M
              </label>
            </li>
            <li>
              <label>
                <input type="checkbox" />
                6M – 55M
              </label>
            </li>
          </ul>
        </div>
      </aside>
    </main>
  </body>
</html>
